name: Deploy Jeffrey River site

# Deploys the jeffrey-river/ folder to GitHub Pages whenever
# changes are pushed to main or the feature branch is merged.
on:
  push:
    branches:
      - main
    paths:
      - "jeffrey-river/**"
      - ".github/workflows/deploy-jeffrey-river.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./jeffrey-river

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
