<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 520" width="500" height="520">
  <!-- Circle border with gap at bottom for river to flow through -->
  <path d="M 215 447 A 200 200 0 1 1 285 447"
        fill="none" stroke="#3B2A1E" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round" />

  <!-- Mountains (right side) — two overlapping ridges -->
  <path d="M 278 300
           Q 290 288 302 262
           Q 312 245 322 278
           Q 338 228 358 224
           Q 372 240 386 274
           Q 395 290 402 300"
        fill="none" stroke="#3B2A1E" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round" />

  <!-- Smaller background ridge for depth -->
  <path d="M 308 272 Q 318 258 330 268 Q 344 250 355 263"
        fill="none" stroke="#3B2A1E" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round"
        opacity="0.55" />

  <!-- Tree foliage (sage cloud shape with brown outline) -->
  <path d="M 105 268
           Q 78 262 82 232
           Q 75 198 110 198
           Q 120 168 156 176
           Q 175 156 208 178
           Q 232 172 226 208
           Q 245 226 226 252
           Q 230 278 200 280
           Q 178 298 150 286
           Q 122 295 105 268 Z"
        fill="#9CAF9A" stroke="#3B2A1E" stroke-width="4"
        stroke-linejoin="round" />

  <!-- Tree trunk (two slightly tapered lines) -->
  <path d="M 148 278 Q 146 320 143 378"
        fill="none" stroke="#3B2A1E" stroke-width="5"
        stroke-linecap="round" />
  <path d="M 172 278 Q 175 320 180 378"
        fill="none" stroke="#3B2A1E" stroke-width="5"
        stroke-linecap="round" />

  <!-- Tree roots spreading at base -->
  <path d="M 143 378 Q 128 388 112 396"
        fill="none" stroke="#3B2A1E" stroke-width="4"
        stroke-linecap="round" />
  <path d="M 180 378 Q 196 388 215 396"
        fill="none" stroke="#3B2A1E" stroke-width="4"
        stroke-linecap="round" />
  <path d="M 162 380 Q 160 395 159 407"
        fill="none" stroke="#3B2A1E" stroke-width="3"
        stroke-linecap="round" />

  <!-- River — two flowing wavy lines from mountain base, through circle gap, exiting below -->
  <path d="M 238 282
           Q 230 320 242 360
           Q 252 400 244 442
           Q 238 478 242 518"
        fill="none" stroke="#7FA3B5" stroke-width="6"
        stroke-linecap="round" />
  <path d="M 270 282
           Q 278 320 268 360
           Q 260 400 270 442
           Q 276 478 272 518"
        fill="none" stroke="#7FA3B5" stroke-width="6"
        stroke-linecap="round" />
</svg>
